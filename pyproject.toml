[project]
name = "screenpipe-python-client"
version = "0.1.0"
description = "Python client and CLI for the screenpipe REST API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tanuj", email = "Tanuj@cmu.edu" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[project]
name = "screenpipe-python-client"
version = "0.1.0"
description = "Python client and CLI for the screenpipe REST API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Tanuj", email = "Tanuj@cmu.edu" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.28.1,<1"]
keywords = ["screenpipe", "screen-recording", "transcription", "api-client"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://github.com/TanGentleman/screenpipe-python-client"
Issues = "https://github.com/TanGentleman/screenpipe-python-client/issues"
screenpipe = "https://github.com/mediar-ai/screenpipe"

[project.scripts]
screenpipe-client = "screenpipe_client.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["screenpipe_client"]
